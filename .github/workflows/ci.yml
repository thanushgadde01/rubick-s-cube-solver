name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript check
        run: npm run build
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test -- --run
